services:
  - type: web
    name: managed-oss-cloud-control-plane
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: PROVISIONING_MODE
        value: dry-run
      - key: PUBLIC_APP_URL
        value: https://managed-oss-cloud.onrender.com
      - key: PUBLIC_HOST_TARGET
        value: managed-oss-cloud.onrender.com
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
